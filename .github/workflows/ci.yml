name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Three independent jobs run in parallel. The current job list was lint +
# typecheck + build only — issue #40 closes the gap by wiring the test
# suites (Vitest unit + Playwright e2e) into the same quality gate so a
# PR can't land without them passing.
#
# Vercel + the GitHub branch protection rule require this `CI` check to
# pass before merge, so any failure here blocks the PR.

jobs:
  build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      # Surface the HTML report on failure so reviewers can inspect trace
      # videos / screenshots without re-running locally.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The template is published open-source. Personal data (emails, handles,
  # GA IDs, signature SVG paths) must never leak in via a PR — even one that
  # looks innocuous. This guard greps the diff for the patterns stored in
  # the PERSONAL_DATA_PATTERNS repo variable and fails the build if any are
  # introduced. The patterns are intentionally NOT inlined here so the file
  # itself stays safe to view in a public repo.
  #
  # To configure: Settings → Secrets and variables → Actions → Variables →
  # add PERSONAL_DATA_PATTERNS as a repo variable with the regex (extended
  # regex syntax, e.g. `foo|bar|baz`). Without it, the job passes silently.
  guard-personal-data:
    name: Guard against personal data leaks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PATTERNS: ${{ vars.PERSONAL_DATA_PATTERNS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grep PR diff for personal-data patterns
        run: |
          set -euo pipefail
          if [ -z "${PATTERNS:-}" ]; then
            echo "PERSONAL_DATA_PATTERNS repo variable is not set; skipping guard."
            exit 0
          fi
          # Only scan source / config / docs files — skip workflow YAML
          # (which legitimately uses ${PATTERNS}) and lockfiles.
          LEAKS=$(git diff --unified=0 --diff-filter=ACMR \
              "origin/${BASE_REF}...HEAD" \
              -- . \
              ':!*.yml' ':!*.yaml' ':!*.lock' \
            | grep -E '^\+' \
            | grep -E "${PATTERNS}" || true)
          if [ -n "${LEAKS}" ]; then
            echo "::error::Personal data leaked into this PR:"
            echo "${LEAKS}"
            exit 1
          fi
          echo "No personal-data patterns found in PR diff."
