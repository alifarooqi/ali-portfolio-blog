name: Refresh Medium feed snapshot

on:
  schedule:
    # Daily at 09:00 UTC. The committed snapshot is the blog's only content
    # source (the runtime does no network I/O), so this workflow is how new
    # Medium posts land in the repo. Daily is cheap: the merge-on-hash
    # script is idempotent, so a run with no Medium changes writes nothing
    # and the commit step skips — a fresh post is live within ~24h,
    # hands-free. The manual trigger below covers "published just now".
    - cron: "0 9 * * *"
  # Manual trigger so the maintainer can refresh on demand (e.g. right after
  # publishing a new Medium post) without waiting for the next scheduled run.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh Medium feed snapshot
    runs-on: ubuntu-latest
    # Maintainer must set MEDIUM_USERNAME (without @) as a repo variable at
    # Settings → Secrets and variables → Actions → Variables. workflow_dispatch
    # also accepts it inline. If unset, the script exits early — no commit.
    env:
      MEDIUM_USERNAME: ${{ vars.MEDIUM_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The merge-on-hash refresh script merges the live RSS feed into the
      # content-addressed snapshot: lib/posts-data/<slug>.json is rewritten
      # only when a post's content hash changes, new slugs are appended to
      # lib/medium-list.json, and posts that aged out of Medium's ~10-item
      # RSS window are never pruned. See the script header for details.
      - name: Refresh Medium feed snapshot
        run: node .agents/skills/medium-feed-refresh/scripts/refresh-feed.mjs

      - name: Check whether the snapshot changed
        id: check
        run: |
          # git status (not git diff) so a brand-new, still-untracked
          # per-post file in lib/posts-data/ also counts as a change.
          if [ -z "$(git status --porcelain -- lib/medium-list.json lib/posts-data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only commit + push when the snapshot actually changed. The [skip ci]
      # tag keeps the CI workflow from running on a data-only commit (no
      # code changed, no need to re-run lint / typecheck / build / e2e).
      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/medium-list.json lib/posts-data
          git commit -m "chore(medium): refresh feed snapshot [skip ci]"
          git push
